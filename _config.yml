# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# ==============================================================================
# Site (站点信息)
# ==============================================================================
title: 绝叫路人H           # 网站标题，显示在浏览器标签页和网页头部
subtitle: ''               # 副标题，可选，有的主题会显示
description: ''            # 网站描述，主要用于SEO（搜索引擎优化），建议写一段简短的自我介绍或博客定位
keywords:                  # 关键词，用于SEO，多个关键词用英文逗号分隔
author: Heptazero          # 你的名字，显示在文章底部或侧边栏
language: zh-CN            # 语言设置。建议改为 'zh-CN' (简体中文)，默认是 'en'
timezone: ''               # 时区，默认使用电脑时区。如果服务器在国外，建议填 'Asia/Shanghai'

# ==============================================================================
# URL (链接设置)
# ==============================================================================
## 如果你的网站放在子目录中，请设置 url 和 root。
## 例如：https://username.github.io/blog/ -> url: https://username.github.io/blog/ -> root: /blog/
url: https://Heptazero.github.io
root: /
# permalink: 文章的永久链接格式
# 默认值: :year/:month/:day/:title/ (例如: 2024/01/24/hello-world/)
# 【建议】: 为了链接简洁，推荐改为 ':title/' (直接使用文章文件名) 或者 ':category/:title/'
# 注意：一旦确定，最好不要频繁修改，否则会导致以前分享出去的链接失效（404）。
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # 是否在链接末尾保留 'index.html'，建议为 false 让链接更干净
  trailing_html: false  # 是否在链接末尾保留 '.html'，建议为 false

# ==============================================================================
# Directory (目录设置 - 建议保持默认)
# ==============================================================================
source_dir: source         # 源码文件夹，存放 Markdown 文件
public_dir: public         # 生成的静态网页文件夹
tag_dir: tags              # 标签页面的目录名
archive_dir: archives      # 归档页面的目录名
category_dir: categories   # 分类页面的目录名
code_dir: downloads/code   # 代码下载目录
i18n_dir: :lang            # 国际化目录
skip_render:               # 跳过渲染的文件/夹（例如 README.md 或 自定义的 HTML 文件）
                           # 格式示例: 
                           # - 'README.md'
                           # - 'demo/**/*'

# ==============================================================================
# Writing (写作设置)
# ==============================================================================
new_post_name: :title.md   # 新文章的文件名格式。默认是标题，例如 `hexo new "My Post"` -> `My Post.md`
default_layout: post       # 默认布局，通常是 'post' (文章) 或 'page' (独立页面)
titlecase: false           # 是否将标题转换为首字母大写
external_link:
  enable: true             # 是否在新标签页打开外部链接，建议 true
  field: site
  exclude: ''
filename_case: 0           # 文件名大小写处理: 0=不变, 1=小写
render_drafts: false       # 是否渲染草稿（source/_drafts 里的文章），由 `hexo publish` 发布
post_asset_folder: true   # 【重要】是否启动资源文件夹。
                           # 建议设为 true。开启后，新建文章时会自动创建一个同名文件夹，
                           # 方便你存放该文章专属的图片，并在文章中用相对路径 `![](图片名.png)` 引用。
relative_link: false       # 是否使用相对路径链接，建议 false
future: true               # 是否发布未来日期的文章
# syntax_highlighter: highlight.js # 代码高亮引擎
highlight:
  enable: false        # 显示行号
  line_number: true
  auto_detect: false       # 自动检测语言
  tab_replace: ''
  wrap: true
  hljs: false

# Also add this line for Hexo 7.0.0+:
syntax_highlighter: # empty

prismjs:                   # 另一种高亮引擎 PrismJS 的设置
  preprocess: true
  line_number: true
  tab_replace: ''

# ==============================================================================
# Home page setting (主页设置)
# ==============================================================================
index_generator:
  path: ''
  per_page: 10             # 主页每页显示的文章数量
  order_by: -date          # 排序方式，'-date' 表示按日期降序（新文章在前）

# ==============================================================================
# Category & Tag (分类与标签)
# ==============================================================================
default_category: uncategorized # 默认分类
category_map:              # 分类别名映射（用于 URL 优化，把中文分类映射为英文 URL）
                           # 示例:
                           #   随笔: essay
                           #   技术: tech
tag_map:                   # 标签别名映射（同上）

# ==============================================================================
# Metadata elements (元数据)
# ==============================================================================
meta_generator: true

# ==============================================================================
# Date / Time format (日期时间格式)
# ==============================================================================
# Hexo 使用 Moment.js 解析日期
# 参考: http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD    # 日期格式: 2024-01-24
time_format: HH:mm:ss      # 时间格式: 14:30:00
updated_option: 'mtime'    # 更新时间取值: 'mtime' (文件修改时间) 或 'date' (Front-matter 中的 date)

# ==============================================================================
# Pagination (分页)
# ==============================================================================
per_page: 10               # 每页文章数 (0 = 关闭分页)
pagination_dir: page       # 分页目录名

# ==============================================================================
# Extensions (扩展)
# ==============================================================================
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
# 当前使用的主题。
# 常用热门主题推荐:
# - 'landscape' (默认主题，简洁)
# - 'butterfly' (功能强大，极其华丽，很多人用)
# - 'next' (极简，非常经典)
# - 'fluid' (美观且配置简单)
# 修改这里前，记得先去 themes/ 目录下下载对应的主题文件夹。
# theme: node-tree
# theme: Academia
# theme: lagom
# theme: hexo-theme-xoxo-plus-master
theme: mashiro
# ==========================
# Search（站内搜索）配置
# ==========================
search:
  path: search.xml          # 生成的搜索索引文件名
  field: all                # 索引所有字段（title、content、tags、categories）
  content: true             # 是否把正文内容也加入索引（会让搜索更精准，但文件会稍大）

# ==============================================================================
# Deployment (部署)
# ==============================================================================
## Docs: https://hexo.io/docs/one-command-deployment
## 这里的 Docs 是 Hexo 官方文档关于“一键部署”的说明链接。
## 你可以保留它，以便将来如果部署出问题或者是想换其他部署方式（比如 Vercel/Netlify）时查阅。
deploy:
  type: git                    # 部署类型，GitHub Pages 必须填 'git'
  # 仓库地址。建议使用 HTTPS (https://...) 或 SSH (git@github.com:...)
  # 注意：老版本 Hexo 可能用 'repo' 这个字段，新版本通常用 'repository'，如果报错可以改名试试。
  repository: https://github.com/Heptazero/HeptaZero.github.io.git
  branch: main                 # 部署的分支。GitHub 现在默认是 main，早期是 master。一定要和你的仓库一致。

# ==============================================================================
# Reading Time (阅读时间插件)
# ==============================================================================
reading_time:
  wpm: 150
  dateFormat: 'LLL'
