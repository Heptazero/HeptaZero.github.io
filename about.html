<p><strong>HeptaZero</strong>，Hepta是希腊语前缀，意为“七”。为了方便可以就叫我<strong>07、hz</strong>。忘记怎么来了的，但是懒得换了</p>
                <p>总有一天要死的，或许就是明天，或许是半世纪后。</p>
                <p>活着只需要吃饱，睡好，剩余的一些时间想干嘛就干嘛。</p>
                <p>所以一些够用的生存筹码对我争取自由比较重要，但是不能因为这个而挤占过多时间，所以至少自己是不讨厌做的。当然啦，最好是自己想做的东西附带的价值。我就想得这么简单，其他的我都不是很在乎。</p>
                <p>因此，我需要找到自己发自内心想做的事——这是永恒的课题</p>
