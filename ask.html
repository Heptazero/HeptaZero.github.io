  <script>
    // -------------------------------------------------------------
    // 提问箱客户端核心逻辑 (Cloudflare Worker API 集成)
    // -------------------------------------------------------------
    (function() {
      // API 基地址配置（已无缝对接你的 Cloudflare Worker）
      var API_BASE = localStorage.getItem('QA_API_BASE') || 'https://blog-qa-worker.1004752777.workers.dev';

      var askInput = document.getElementById('ask-input');
      var askCounter = document.getElementById('ask-counter');
      var askBtn = document.getElementById('ask-submit-btn');
      var askBanner = document.getElementById('ask-banner');
      var qaStream = document.getElementById('qa-stream');
      var qaAdminBtn = document.getElementById('qa-admin-btn');
      var qaAdminPanel = document.getElementById('qa-admin-panel');
      var qaAdminPending = document.getElementById('qa-admin-pending-list');

      // 1. 输入字数计数监听
      if (askInput) {
        askInput.addEventListener('input', function() {
          var len = askInput.value.length;
          askCounter.textContent = len + ' / 1000';
        });
      }

      // 2. 匿名提交问题
      if (askBtn) {
        askBtn.addEventListener('click', function() {
          var content = (askInput.value || '').trim();
          if (!content) {
            showBanner('请输入您想提出的问题或留言', 'error');
            return;
          }

          askBtn.disabled = true;
          askBtn.textContent = '投递中...';

          fetch(API_BASE + '/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content })
          })
          .then(function(res) {
            return res.json().catch(function() { return { success: false }; });
          })
          .then(function(data) {
            if (data.success) {
              askInput.value = '';
              askCounter.textContent = '0 / 1000';
              showBanner(data.message || '提问已匿名投递成功！博主作答后将沉淀在此。', 'success');
            } else {
              showBanner(data.error || '投递未成功，服务可能正在部署或初始化中。', 'error');
            }
          })
          .catch(function(err) {
            showBanner('网络连接失败或云服务尚未上线，请稍后再试。', 'error');
          })
          .finally(function() {
            askBtn.disabled = false;
            askBtn.textContent = '匿名投递';
          });
        });
      }

      function showBanner(msg, type) {
        askBanner.className = 'ask-status-banner ' + type;
        askBanner.textContent = msg;
        askBanner.style.display = 'block';
        setTimeout(function() {
          askBanner.style.display = 'none';
        }, 6000);
      }

      // 3. 拉取已公开的问答流并渲染
      function loadQuestions() {
        fetch(API_BASE + '/api/questions')
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.success && data.questions && data.questions.length > 0) {
              renderQuestions(data.questions);
            } else {
              qaStream.innerHTML = '<div class="qa-empty-state">暂无公开问答，欢迎在上方提出第一个问题。</div>';
            }
          })
          .catch(function() {
            // 优雅降级占位展示（若 Worker 尚未部署完成）
            qaStream.innerHTML = '<div class="qa-empty-state">提问服务初始化中。一旦后台 Worker 配置上线，此处将自动同步问答。</div>';
          });
      }

      function renderQuestions(list) {
        var html = '';
        list.forEach(function(item) {
          var dateStr = (item.answered_at || item.created_at || '').substring(0, 10);
          html += '<div class="qa-card" id="qa-' + item.id + '">';
          html += '  <div class="qa-question-section">';
          html += '    <span class="qa-badge-q">Q</span>';
          html += '    <div class="qa-question-text">';
          html += '      ' + escapeHtml(item.content);
          html += '      <time class="qa-meta-time">' + dateStr + '</time>';
          html += '    </div>';
          html += '  </div>';
          html += '  <div class="qa-answer-section">';
          html += '    <span class="qa-badge-a">A</span>';
          html += '    <div class="qa-answer-text">' + formatAnswer(item.answer) + '</div>';
          html += '  </div>';
          html += '</div>';
        });
        qaStream.innerHTML = html;

        // KaTeX 重新渲染数学公式
        if (window.renderMathInElement) {
          try {
            renderMathInElement(qaStream, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ],
              throwOnError: false
            });
          } catch(e) {}
        }
      }

      function escapeHtml(text) {
        var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return (text || '').replace(/[&<>"']/g, function(m) { return map[m]; });
      }

      function formatAnswer(text) {
        if (!text) return '';
        var safe = escapeHtml(text);
        // 支持段落折行
        return '<p>' + safe.replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
      }

      // 4. 博主管理暗门鉴权
      var adminToken = sessionStorage.getItem('QA_ADMIN_TOKEN');

      if (qaAdminBtn) {
        qaAdminBtn.addEventListener('click', function() {
          if (!adminToken) {
            var input = prompt('请输入提问箱博主管理密码：');
            if (!input) return;
            adminToken = input.trim();
            sessionStorage.setItem('QA_ADMIN_TOKEN', adminToken);
          }
          toggleAdminPanel();
        });
      }

      function toggleAdminPanel() {
        if (!qaAdminPanel) return;
        qaAdminPanel.classList.toggle('active');
        if (qaAdminPanel.classList.contains('active')) {
          loadPendingQuestions();
        }
      }

      function loadPendingQuestions() {
        qaAdminPending.innerHTML = '正在加载待回复提问...';
        fetch(API_BASE + '/api/admin/pending', {
          headers: { 'Authorization': 'Bearer ' + adminToken }
        })
        .then(function(res) {
          if (res.status === 401) {
            sessionStorage.removeItem('QA_ADMIN_TOKEN');
            adminToken = null;
            throw new Error('密码错误或未授权');
          }
          return res.json();
        })
        .then(function(data) {
          if (!data.success || !data.pending || data.pending.length === 0) {
            qaAdminPending.innerHTML = '<div style="color:#64748b; padding:10px 0;">当前没有待回复的新提问。</div>';
            return;
          }
          renderPending(data.pending);
        })
        .catch(function(err) {
          qaAdminPending.innerHTML = '<div style="color:#ef4444;">' + (err.message || '加载失败') + '</div>';
        });
      }

      function renderPending(list) {
        var html = '';
        list.forEach(function(item) {
          html += '<div class="qa-admin-pending-item" id="pending-' + item.id + '">';
          html += '  <div style="font-weight:600; color:#1e293b; margin-bottom:6px;">' + escapeHtml(item.content) + '</div>';
          html += '  <div style="font-size:12px; color:#94a3b8; font-family:ChineseMono,monospace; margin-bottom:8px;">' + (item.created_at || '') + '</div>';
          html += '  <textarea class="qa-admin-reply-box" id="reply-input-' + item.id + '" placeholder="在此输入公开发布的回答……（支持 LaTeX）" rows="3"></textarea>';
          html += '  <div class="qa-admin-actions">';
          html += '    <button class="qa-btn-delete" onclick="window.qaDeleteQuestion(' + item.id + ')">忽略删除</button>';
          html += '    <button class="qa-btn-publish" onclick="window.qaPublishAnswer(' + item.id + ')">公开发布</button>';
          html += '  </div>';
          html += '</div>';
        });
        qaAdminPending.innerHTML = html;
      }

      window.qaPublishAnswer = function(id) {
        var replyInput = document.getElementById('reply-input-' + id);
        var answer = (replyInput ? replyInput.value : '').trim();
        if (!answer) {
          alert('请先输入回答内容再发布！');
          return;
        }

        fetch(API_BASE + '/api/admin/reply', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
          },
          body: JSON.stringify({ id: id, answer: answer })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.success) {
            alert('发布成功！已沉淀至公开问答墙。');
            loadPendingQuestions();
            loadQuestions();
          } else {
            alert('发布失败：' + (data.error || '未知错误'));
          }
        });
      };

      window.qaDeleteQuestion = function(id) {
        if (!confirm('确定要删除这条提问吗？')) return;
        fetch(API_BASE + '/api/admin/delete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
          },
          body: JSON.stringify({ id: id })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.success) {
            loadPendingQuestions();
          } else {
            alert('删除失败：' + (data.error || '未知错误'));
          }
        });
      };

      // 初始化加载问答流
      loadQuestions();
    })();
  </script>
